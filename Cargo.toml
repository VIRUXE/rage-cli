[package]
name = "rage-cli"
version = "0.25.0"
edition = "2024"
authors = ["VIRUXE"]
description = "Swiss-army CLI for RAGE game files: RPF archives, RSC7 resources, textures, renders and navmeshes"
license = "Unlicense"
repository = "https://github.com/VIRUXE/rage-cli"
keywords = ["gta", "rage", "rpf", "gta5", "modding"]
categories = ["command-line-utilities", "compression", "parsing"]
exclude = ["docs/superpowers/**", ".superpowers/**"]

[[bin]]
name = "rage"
path = "src/main.rs"

[features]
default = []
# Local text embeddings for `catalog embed` and `catalog search --semantic/--hybrid`.
semantic = ["dep:fastembed"]

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive", "env"] }
rpf-archive = "0.10"
rage-formats = "0.5.0"
glob = "0.3"
rage-render = "0.5"
ureq = "3.4"
json = "0.12"
roxmltree = "0.20"
sha2 = "0.10"
memmap2 = "0.9.11"
rayon = "1.12.0"
rusqlite = { version = "0.40", features = ["bundled"] }
fastembed = { version = "7", optional = true, default-features = false, features = ["ort-download-binaries", "hf-hub-native-tls"] }

[dev-dependencies]
tempfile = "3.10"
rage-formats = { version = "0.5.0", features = ["test-support"] }

# `rage mcp` swaps the process's stdout for stderr so the protocol owns it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Optimizations for release builds
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

# rusty_dds has a debug_assert in its BC7 seed search that real images
# trip; release builds are unaffected, so debug builds get the same code.
[profile.dev.package.rusty_dds]
debug-assertions = false
opt-level = 3

