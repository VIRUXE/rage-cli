[package]
name = "rage-cli"
version = "0.16.0"
edition = "2024"
authors = ["VIRUXE"]
description = "Swiss-army CLI for RAGE game files: RPF archives, RSC7 resources, textures, renders and navmeshes"
license = "Unlicense"
repository = "https://github.com/VIRUXE/rage-cli"
keywords = ["gta", "rage", "rpf", "gta5", "modding"]
categories = ["command-line-utilities", "compression", "parsing"]

[[bin]]
name = "rage"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive", "env"] }
rpf-archive = { version = "0.10", path = "../rpf-archive-rs" }
rage-formats = { version = "0.1", path = "../rage-formats" }
rage-render = { version = "0.1", path = "../rage-render" }
ureq = "3.4"
json = "0.12"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"

# Cross-compilation targets
[target.'cfg(windows)'.dependencies]
# Windows-specific dependencies if needed

[target.'cfg(unix)'.dependencies]
# Unix/Linux-specific dependencies if needed

# Optimizations for release builds
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
